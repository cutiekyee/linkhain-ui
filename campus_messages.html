<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Campus Messages</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #F8F9FA;
    color: #1F2937;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Top Bar */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px 10px 16px;
    background: #FFFFFF;
    border-bottom: 1px solid #F0EEEC;
  }
  .title-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header h1 {
    font-size: 19px;
    font-weight: 800;
    color: #6B1728;
    letter-spacing: -0.3px;
  }
  .status-badge {
    font-size: 11px;
    font-weight: 700;
    color: #0D9488;
    background-color: #ECFDF5;
    padding: 4px 10px;
    border-radius: 12px;
    border: 1px solid #D1FAE5;
  }

  /* Search Bar */
  .search-container {
    padding: 12px 14px 8px 14px;
    background: #F8F9FA;
  }
  .search-box {
    display: flex;
    align-items: center;
    background: #FFFFFF;
    border: 1.5px solid #E5E7EB;
    border-radius: 12px;
    padding: 8px 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    transition: border-color 0.2s;
  }
  .search-box:focus-within {
    border-color: #6B1728;
  }
  .search-icon {
    width: 17px;
    height: 17px;
    fill: #9CA3AF;
    margin-right: 9px;
    flex-shrink: 0;
  }
  .search-input {
    border: none;
    outline: none;
    font-size: 13.5px;
    width: 100%;
    color: #1F2937;
    background: transparent;
  }
  .search-input::placeholder {
    color: #9CA3AF;
  }

  /* Conversation List */
  .conversation-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 14px 14px 14px;
  }
  .card {
    display: flex;
    align-items: center;
    background: #FFFFFF;
    border: 1px solid #E5E7EB;
    border-radius: 14px;
    padding: 11px 13px;
    margin-bottom: 9px;
    box-shadow: 0 1px 3px rgba(36,24,32,0.04);
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s, background-color 0.15s;
  }
  .card:active {
    transform: scale(0.985);
    background-color: #FDFBFA;
  }
  .avatar-wrap {
    position: relative;
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    margin-right: 12px;
  }
  .avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid #F3F4F6;
  }
  .online-indicator {
    position: absolute;
    bottom: 1px;
    right: 1px;
    width: 10px;
    height: 10px;
    background-color: #10B981;
    border: 2px solid #FFFFFF;
    border-radius: 50%;
  }
  .card-content {
    flex: 1;
    min-width: 0;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 3px;
  }
  .sender-name {
    font-size: 14.5px;
    font-weight: 700;
    color: #111827;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .top-right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .time {
    font-size: 11px;
    color: #8A7A80;
    font-weight: 500;
  }
  .unread-badge {
    background-color: #6B1728;
    color: #FFFFFF;
    font-size: 10px;
    font-weight: 800;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .preview-text {
    font-size: 12.5px;
    color: #6B7280;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }

  /* Chat Thread Overlay View */
  #chat-thread {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: #F8F9FA;
    z-index: 100;
    flex-direction: column;
  }
  .thread-header {
    display: flex;
    align-items: center;
    background: #FFFFFF;
    padding: 10px 14px;
    border-bottom: 1px solid #E5E7EB;
    gap: 10px;
  }
  .btn-back {
    background: transparent;
    border: none;
    font-size: 20px;
    color: #6B1728;
    cursor: pointer;
    font-weight: 800;
    padding: 4px 8px;
  }
  .thread-title-wrap {
    flex: 1;
  }
  .thread-title {
    font-size: 15px;
    font-weight: 700;
    color: #111827;
  }
  .thread-subtitle {
    font-size: 11px;
    color: #0D9488;
    font-weight: 600;
  }
  .messages-container {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 13px;
    line-height: 1.4;
  }
  .bubble.mine {
    align-self: flex-end;
    background: #6B1728;
    color: #FFFFFF;
    border-bottom-right-radius: 4px;
  }
  .bubble.theirs {
    align-self: flex-start;
    background: #FFFFFF;
    color: #1F2937;
    border: 1px solid #E5E7EB;
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .bubble-time {
    font-size: 10px;
    margin-top: 4px;
    text-align: right;
    opacity: 0.7;
  }
  .reply-bar {
    display: flex;
    align-items: center;
    padding: 8px 12px;
    background: #FFFFFF;
    border-top: 1px solid #E5E7EB;
    gap: 8px;
  }
  .reply-input {
    flex: 1;
    background: #F3F4F6;
    border: none;
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 13px;
    outline: none;
  }
  .btn-send {
    background: #6B1728;
    border: none;
    color: #FFFFFF;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .btn-send svg {
    width: 16px;
    height: 16px;
    fill: #FFFFFF;
    margin-left: 2px;
  }
</style>
</head>

  var activeConv = null;

  // Search filter
  document.getElementById('search-input').addEventListener('input', function(e) {
    var q = e.target.value.toLowerCase();
    var cards = document.querySelectorAll('.card');
    cards.forEach(function(card) {
      var text = card.textContent.toLowerCase();
      card.style.display = text.indexOf(q) !== -1 ? 'flex' : 'none';
    });
  });

  function openConversation(id, name, status, avatar) {
    activeConv = conversations.find(function(c) { return c.id === id; });
    if (!activeConv) return;

    document.getElementById('thread-name').textContent = activeConv.name;
    document.getElementById('thread-status').textContent = activeConv.status;
    document.getElementById('thread-avatar').src = activeConv.avatar;

    renderMessages();
    document.getElementById('chat-thread').style.display = 'flex';

    // Bridge notification to MIT App Inventor
    if (window.AppInventor && window.AppInventor.setWebViewString) {
      window.AppInventor.setWebViewString(JSON.stringify({
        event: 'conversation_opened',
        threadId: activeConv.id,
        name: activeConv.name
      }));
    }
  }

  function closeConversation() {
    document.getElementById('chat-thread').style.display = 'none';
    activeConv = null;
    if (window.AppInventor && window.AppInventor.setWebViewString) {
      window.AppInventor.setWebViewString(JSON.stringify({ event: 'conversation_closed' }));
    }
  }

  function renderMessages() {
    var container = document.getElementById('thread-messages');
    container.innerHTML = '';
    if (!activeConv) return;

    activeConv.messages.forEach(function(m) {
      var b = document.createElement('div');
      b.className = 'bubble ' + (m.mine ? 'mine' : 'theirs');
      b.innerHTML = m.text + '<div class="bubble-time">' + m.time + '</div>';
      container.appendChild(b);
    });
    container.scrollTop = container.scrollHeight;
  }

  function sendMessage() {
    var input = document.getElementById('reply-input');
    var text = input.value.trim();
    if (!text || !activeConv) return;

    var now = new Date();
    var timeStr = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

    activeConv.messages.push({ mine: true, text: text, time: timeStr });
    activeConv.preview = text;
    activeConv.time = timeStr;
    input.value = '';
    renderMessages();

    if (window.AppInventor && window.AppInventor.setWebViewString) {
      window.AppInventor.setWebViewString(JSON.stringify({
        event: 'message_sent',
